name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: Type-check
        run: npm run typecheck

      - name: Run tests with coverage
        run: npm run test:coverage

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy to production VM
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd ~/shrimp-fried-this-rice
            git fetch
            git reset --hard origin/main
            npm ci
            restarted_at=$(date '+%Y-%m-%d %H:%M:%S')
            sudo systemctl restart discordbotshrimp
            npm run deploycommands
            # A bot that can't log in still shows as active until it exits,
            # and Restart=on-failure brings it back, so wait for ready.ts's line.
            for attempt in $(seq 1 30); do
              if sudo journalctl -u discordbotshrimp --since "$restarted_at" --no-pager -o cat | grep -q '^Ready! Logged in as'; then
                echo "Bot logged in."
                break
              fi
              if [ "$attempt" -eq 30 ]; then
                echo "Bot did not log in within 60 s of the restart. Its log since then:"
                sudo journalctl -u discordbotshrimp --since "$restarted_at" --no-pager
                exit 1
              fi
              sleep 2
            done
            sudo systemctl status discordbotshrimp --no-pager
